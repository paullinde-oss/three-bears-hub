<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AvatarKit Demo</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4efe3;margin:0;padding:20px;color:#1a1a1a}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  img.pix{border-radius:50%;background:#fff;border:2px solid #ddd3bf}
  button{padding:10px 16px;border-radius:8px;border:none;background:#c75a2c;color:#fff;font-weight:700;cursor:pointer}
  pre{background:#fff;padding:10px;border-radius:8px;font-size:12px;overflow:auto}
</style>
</head>
<body>
<h2>AvatarKit demo</h2>
<p>Standalone test page: <code>avatar-kit.js</code> + <code>parts.json</code> are all you need.</p>
<div class="row" id="faces"></div>
<p class="row"><button id="edit">Edit avatar</button><button id="rand">Random team</button></p>
<pre id="cfg"></pre>
<script src="avatar-kit.js"></script>
<script>
let cfg = null;
function show() {
  document.getElementById('cfg').textContent = JSON.stringify(cfg, null, 2);
}
function team() {
  document.getElementById('faces').innerHTML = Array.from({ length: 8 }, (_, i) =>
    `<img class="pix" width="96" height="96" src="${AvatarKit.toDataURL(AvatarKit.random(), { crop: true, size: 192, number: i * 7 + 2, captain: i === 0 })}">`).join('');
}
AvatarKit.load('parts.json').then(() => {
  cfg = AvatarKit.defaults(); team(); show();
  document.getElementById('rand').onclick = team;
  document.getElementById('edit').onclick = () => AvatarKit.openEditor({ config: cfg, number: 7, captain: true, onSave: c => { cfg = c; show(); } });
});
</script>
</body>
</html>
